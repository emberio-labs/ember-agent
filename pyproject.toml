[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "emberio-labs-ember-agent"
version = "0.2.0"
description = "Готовый к запуску агент на базе ember: настройка в TOML, запуск одной командой."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = "MIT"
authors = [{ name = "Emberio Labs", email = "dev@emberio.labs" }]
keywords = ["agent", "llm", "ai", "cli", "ember", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "emberio-labs-ember[openai,mcp]>=0.3.0,<1.0",
    "rich>=13.0.0,<16.0.0",
]

[project.scripts]
ember-agent = "ember_agent.cli:main"

[tool.poetry]
packages = [{ include = "ember_agent" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.11.0"
mypy = "^1.15.0"

# --- Ruff: линтер и форматтер ---
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["ember_agent", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: ошибки
    "W",   # pycodestyle: предупреждения
    "F",   # pyflakes
    "I",   # isort (порядок импортов)
    "UP",  # pyupgrade (современный синтаксис)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RUF", # специфичные для ruff
]
ignore = [
    "RUF001", # проект пишется на русском: кириллица в строках — не ошибка
    "RUF002", # то же для docstring
    "RUF003", # то же для комментариев
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PT009"] # в тестах используем обычные assert, а не unittest-стиль

# --- mypy: статическая типизация ---
[tool.mypy]
python_version = "3.12"
files = ["ember_agent", "tests"]
ignore_missing_imports = true # ember и dev-зависимости могут быть без стабов
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
