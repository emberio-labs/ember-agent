# Пример конфигурации ember-agent.
# Скопируйте в config.toml и запустите: ember-agent run
#
# Все секции опциональны — пустой файл создаст агента на MockProvider.

[agent]
# Системный промпт: как агент себя ведёт.
system_prompt = "Ты полезный и краткий помощник."

[provider]
# Тип провайдера:
#   "mock"   — работает без сети и ключей (по умолчанию, для экспериментов)
#   "openai" — OpenAI и любые OpenAI-совместимые API (OpenRouter, Groq, vLLM, LM Studio...)
type = "mock"
# Модель подключения LLM (для type = "openai"). Если не задана, провайдер
# берёт свою модель по умолчанию ("gpt-4o-mini" у OpenAI).
# model = "gpt-4o-mini"
# Переменная окружения, из которой берётся API-ключ (для type = "openai").
api_key_env = "OPENAI_API_KEY"
# Полный base_url до /v1-совместимого API (для type = "openai", опционально).
# По умолчанию — https://api.openai.com/v1
# base_url = "https://api.groq.com/openai/v1"

# Межсессионная память агента. По умолчанию ВЫКЛЮЧЕНА: без секции (или при
# enabled = false) агент ничего не пишет на диск. Механику хранения и recall
# (поиск по прошлым сессиям) реализует библиотека ember.
#
# [memory]
# enabled = true
# # Тип хранилища. Пока поддерживается только "file" — JSONL-файл на сессию.
# type = "file"
# # Директория с файлами сессий (относительный путь — от текущей директории).
# directory = ".ember/memory"
# # Идентификатор сессии: запуски с одним session_id продолжают друг друга,
# # а из остальных сессий агент подтягивает релевантные фрагменты (recall).
# session_id = "default"

# Внешние инструменты по MCP (Model Context Protocol). Опционально.
# [[mcp.servers]]
# transport = "stdio"            # дочерний процесс: "python", "npx" и т.п.
# command = "python"
# args = ["path/to/server.py"]
#
# [[mcp.servers]]
# transport = "http"             # streamable HTTP-сервер
# url = "http://127.0.0.1:8000/mcp"
# headers = { Authorization = "Bearer YOUR_TOKEN" }
